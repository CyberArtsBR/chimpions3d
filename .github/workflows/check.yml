name: Chimp Jump build and checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: node checks/physics.mjs
      - run: node checks/assets.mjs
      - run: node checks/jump-audit.mjs
      - name: Check production audit syntax
        run: node --check checks/production-browser.mjs
      - name: Install desktop browser test runtime
        run: |
          npx playwright install --with-deps chromium
      - name: Run desktop browser audit
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/chimp-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/?test=1 >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/?test=1 >/dev/null
          node checks/game-browser.mjs
      - name: Inspect source GLB
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const b = fs.readFileSync('public/model/chimpion.glb');
          const json = JSON.parse(b.subarray(20, 20 + b.readUInt32LE(12)).toString());
          console.log(JSON.stringify({skins: json.skins, nodes: json.nodes.map(({name,children,translation,rotation}) => ({name,children,translation,rotation}))}, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chimp-jump-reports
          path: |
            checks/*.png
            checks/*-report.json
