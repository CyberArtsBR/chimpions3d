name: Chimp Jump final production verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser runtime
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify final Render revision
        env:
          CHIMP_PRODUCTION_URL: https://chimp-jump.onrender.com
          CHIMP_EXPECTED_COMMIT: 3007dca3681b94871576efd81016e96e27170ef5
        run: node checks/production-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chimp-jump-final-production-verification
          path: |
            checks/production-*.png
            checks/production-browser-report.json
