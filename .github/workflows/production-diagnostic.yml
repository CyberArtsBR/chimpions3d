name: Chimp Jump production diagnostic
on:
  pull_request:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Diagnose deployed start
        run: node checks/production-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chimp-jump-production-diagnostic
          path: checks/production-diagnostic.png
