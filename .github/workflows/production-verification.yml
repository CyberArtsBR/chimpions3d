name: Chimp Jump production verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  production-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install production browser runtime
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify public Render desktop build
        env:
          CHIMP_PRODUCTION_URL: https://chimp-jump.onrender.com
        run: |\n          node checks/production-diagnostic.mjs\n          node checks/production-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chimp-jump-production-verification
          path: |
            checks/production-*.png\n            checks/production-diagnostic.png
            checks/production-browser-report.json
